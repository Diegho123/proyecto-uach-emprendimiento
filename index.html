<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1218" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Integra Pyme — controla tu punto de equilibrio, márgenes y flujo de caja sin planillas."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233450dd'/%3E%3Cpath d='M8 22.5V16.5' stroke='white' stroke-opacity='0.5' stroke-width='2.75' stroke-linecap='round'/%3E%3Cpath d='M14.5 22.5V12' stroke='white' stroke-opacity='0.75' stroke-width='2.75' stroke-linecap='round'/%3E%3Cpath d='M21 22.5V8.5' stroke='white' stroke-width='2.75' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Integra Pyme</title>
    <script>
      // Aplica el tema antes del primer pintado: evita el destello blanco
      // al recargar con el tema oscuro activo.
      try {
        const guardado = localStorage.getItem('integra-pyme:tema');
        const oscuro =
          guardado === 'oscuro' ||
          (!guardado && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
